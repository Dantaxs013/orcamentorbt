version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rbt-orcamentos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rbt_orcamentos
    ports:
      - '5432:5432'
    volumes:
      - rbt_pgdata:/var/lib/postgresql/data

volumes:
  rbt_pgdata:
    driver: local
